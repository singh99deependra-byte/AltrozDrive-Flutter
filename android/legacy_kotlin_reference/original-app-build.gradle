plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.altrozdrive.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.altrozdrive.app'
        minSdk 26
        targetSdk 35
        versionCode 12305
        versionName '1.1.20'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        // MapLibre 13.6.1 contains Kotlin metadata 2.2.0, while this app intentionally
        // remains on Kotlin 1.9.0 because its Compose compiler is 1.5.0.
        // MapLibre is accessed only through the Java bridge, so skip metadata validation
        // rather than upgrading the whole app's Kotlin/Compose toolchain.
        freeCompilerArgs += ['-Xskip-metadata-version-check']
    }

    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions { kotlinCompilerExtensionVersion '1.5.0' }

    packaging {
        resources.excludes += '/META-INF/{AL2.0,LGPL2.1}'
        // MapLibre's native library is distributed without the metadata required by
        // the Android strip task. Keep its symbols intact so stripDebugDebugSymbols
        // does not emit an 'Unable to strip libmaplibre.so' warning.
        jniLibs.keepDebugSymbols += ['**/libmaplibre.so']
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2023.08.00')
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material:material'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'
    implementation('org.maplibre.gl:android-sdk:13.6.1') { exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib' }
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
