pluginManagement {
    // Flutter's tooling normally creates android/local.properties during `flutter pub get`.
    // Support FLUTTER_ROOT as a fallback, and fail with an actionable message if neither
    // configuration is available instead of throwing FileNotFoundException.
    def flutterSdkPath = {
        def properties = new Properties()
        def localProperties = file('local.properties')
        if (localProperties.exists()) {
            localProperties.withInputStream { properties.load(it) }
        }
        def sdkPath = properties.getProperty('flutter.sdk')
        if (sdkPath == null || sdkPath.trim().isEmpty()) {
            sdkPath = System.getenv('FLUTTER_ROOT')
        }
        if (sdkPath == null || sdkPath.trim().isEmpty()) {
            throw new GradleException(
                'Flutter SDK path is not configured. From the project root, run `flutter pub get` to generate android/local.properties, ' +
                'or create android/local.properties with a line like `flutter.sdk=/absolute/path/to/flutter`. ' +
                'Alternatively set the FLUTTER_ROOT environment variable. Do not commit a machine-specific local.properties file.'
            )
        }
        return sdkPath
    }()
    includeBuild("${flutterSdkPath}/packages/flutter_tools/gradle")
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
plugins {
    id 'dev.flutter.flutter-plugin-loader' version '1.0.0'
    id 'com.android.application' version '8.7.3' apply false
    id 'org.jetbrains.kotlin.android' version '2.1.0' apply false
}
include ':app'
